name: Generate artwork previews
on:
  push:
    branches: [optimize-viewer-artworks]
    paths: ['.github/workflows/optimize-artworks.yml']
permissions:
  contents: write
jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow
      - run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for name in ('muscles','hypertrophy','hermathena-performance','marcurius-muscle-texture'):
              p = Path('images/notes') / (name + '.png')
              with Image.open(p) as im:
                  im = im.convert('RGB')
                  im.thumbnail((1000, 1500))
                  im.save(p.with_name(name + '-viewer.webp'), 'WEBP', quality=82)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/notes/*-viewer.webp
          git commit -m "Add optimized WebP artwork previews"
          git push
